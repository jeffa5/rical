[package]
name = "rical"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.42"
clap = { version = "4.5.49", features = ["derive"] }
comfy-table = "7.2.1"
env_logger = { version = "0.11.8", features = ["kv"] }
icalendar = { version = "0.17.5", features = ["serde", "chrono-tz"] }
log = { version = "0.4.28", features = ["kv"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[patch.crates-io]
icalendar = { git = "https://github.com/jeffa5/icalendar.git", branch = "expose-other" }
