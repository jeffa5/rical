[workspace]
resolver = "3"
members = ["crates/compact-ics", "crates/rical-core", "crates/rical", "crates/rical-calendar"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
rical-core = { path = "crates/rical-core" }
compact-ics = { path = "crates/compact-ics" }
anyhow = "1.0.100"
chrono = "0.4.42"
clap = { version = "4.5.49", features = ["derive", "env"] }
comfy-table = "7.2.1"
env_logger = { version = "0.11.8", features = ["kv"] }
icalendar = { version = "0.17.15", features = ["serde", "chrono-tz"] }
log = { version = "0.4.28", features = ["kv"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_plain = "1.0.2"

