[package]
name = "rical-ui"
description = "What rical's GTK apps share: the command line, key bindings, settings files, logging and widgets"
version.workspace = true
edition.workspace = true

[dependencies]
rical-core.workspace = true
chrono.workspace = true
env_filter = "0.1"
libc = "0.2"
log.workspace = true
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_18"] }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_8"] }
nucleo-matcher = "0.3.1"
pangocairo = "0.22.9"
