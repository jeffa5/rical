# Mail's default key bindings, in aerc's binds.conf format. Override or add
# to these in ~/.config/rical-mailbox/binds.conf.
# Sections: [global] applies everywhere; [list] is the message list, and
# [write] the window you write in; they take precedence in their own place.

[global]
: = :
? = :help<Enter>
<C-,> = :settings<Enter>
<C-q> = :quit<Enter>

[list]
/ = :search<Enter>
<C-f> = :search<Enter>

# moving
j = :select next<Enter>
k = :select prev<Enter>
<Down> = :select next<Enter>
<Up> = :select prev<Enter>
gg = :select first<Enter>
G = :select last<Enter>
n = :select next-unread<Enter>
N = :select prev-unread<Enter>
<Enter> = :open<Enter>
<Esc> = :back<Enter>

# folders
F = :folders<Enter>
<C-o> = :folder<space>
gi = :folder INBOX<Enter>
gs = :folder Sent<Enter>
gd = :folder Drafts<Enter>
gt = :folder Trash<Enter>
ga = :folder Archive<Enter>
gj = :folder Junk<Enter>
go = :outbox<Enter>
t = :threads toggle<Enter>

# writing
c = :compose<Enter>
<C-n> = :compose<Enter>
r = :reply<Enter>
R = :replyall<Enter>
f = :forward<Enter>
e = :edit<Enter>

# dealing with it
a = :archive<Enter>
d = :delete<Enter>
<Delete> = :delete<Enter>
! = :junk<Enter>
m = :move<space>
U = :mark toggle<Enter>
s = :flag<Enter>
u = :undo<Enter>
<C-z> = :undo<Enter>

# what is in it
o = :links<Enter>
i = :invite<Enter>
@ = :contact<Enter>
w = :attachment save all<Enter>
H = :headers<Enter>
V = :source<Enter>

# mail from and to the outside
<C-r> = :sync<Enter>
<F5> = :reload<Enter>
<C-w> = :wake<Enter>

[write]
<C-Enter> = :send<Enter>
<C-s> = :save<Enter>
<C-e> = :edit-external<Enter>
<A-Q> = :reflow all<Enter>
<A-q> = :reflow<Enter>
<C-w> = :close<Enter>
<A-x> = :
<A-m> = :markdown toggle<Enter>
<C-b> = :format bold<Enter>
<C-i> = :format italic<Enter>
<C-k> = :format link<Enter>
