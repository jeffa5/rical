[package]
name = "rical-mail"
description = "Mail (rical): a keyboard-first, private mail client for Maildir folders"
version.workspace = true
edition.workspace = true

[dependencies]
rical-maildir = { path = "../rical-maildir" }
rical-mail-queue = { path = "../rical-mail-queue" }
rical-cards.workspace = true
rical-core.workspace = true
rical-ui.workspace = true
anyhow.workspace = true
chrono.workspace = true
log.workspace = true
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_18"] }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_8"] }

[dev-dependencies]
tempfile = "3.27.0"
