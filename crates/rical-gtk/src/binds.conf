# rical's default key bindings, in aerc's binds.conf format.
#
# Override or add to these in ~/.config/rical/binds.conf. Each line maps
# keys to command lines: ":cmd args<Enter>" runs a command, several can be
# chained, and leaving off <Enter> opens the command line prefilled.
# An empty value removes a binding. Sections: [global] applies everywhere,
# [grid] (day and week), [month] and [agenda] take precedence in their view.
#
# Arrows, Enter, Space, Escape and Page Up/Down only act on the calendar
# when it has focus, so they still work in the sidebar and dialogs.

[global]
: = :
? = :help<Enter>
/ = :search<Enter>
<C-q> = :quit<Enter>
<C-r> = :reload<Enter>
<F5> = :reload<Enter>
<F9> = :sidebar<Enter>
<C-,> = :settings<Enter>

# navigation
t = :today<Enter>
n = :next<Enter>
p = :prev<Enter>
<PageDown> = :next<Enter>
<PageUp> = :prev<Enter>
g = :goto<space>
<C-g> = :goto<space>
h = :focus -1<Enter>
l = :focus +1<Enter>
<Left> = :focus -1<Enter>
<Right> = :focus +1<Enter>

# views
d = :view day<Enter>
w = :view week<Enter>
m = :view month<Enter>
z = :view year<Enter>
a = :view agenda<Enter>
T = :view tasks<Enter>
I = :view invitations<Enter>
E = :view journal<Enter>
# by number of days
1 = :view day<Enter>
2 = :view 2days<Enter>
3 = :view 3days<Enter>
4 = :view 4days<Enter>
5 = :view 5days<Enter>
6 = :view 6days<Enter>
7 = :view fullweek<Enter>
W = :view workweek<Enter>
# from a subtask to its parent task
^ = :up<Enter>
# extra time zones beside the hours: show or hide
Z = :zones<Enter>
<C-1> = :view day<Enter>
<C-2> = :view week<Enter>
<C-3> = :view month<Enter>
<C-4> = :view agenda<Enter>
<C-5> = :view tasks<Enter>
<C-6> = :view invitations<Enter>
<C-7> = :view journal<Enter>

# selecting events
j = :select next<Enter>
k = :select prev<Enter>
<Down> = :select next<Enter>
<Up> = :select prev<Enter>
<Enter> = :open<Enter>
<space> = :open<Enter>
<Esc> = :select none<Enter>

# editing
c = :new<Enter>
<C-n> = :new<Enter>
C = :new<space>
e = :edit<Enter>
O = :link<Enter>
M = :map<Enter>
R = :raw<Enter>
v = :reveal<Enter>
<C-t> = :convert<Enter>
<C-e> = :edit<Enter>
x = :delete<Enter>
<Delete> = :delete<Enter>
J = :move +15m<Enter>
K = :move -15m<Enter>
H = :move -1d<Enter>
L = :move +1d<Enter>
<S-Down> = :move +15m<Enter>
<S-Up> = :move -15m<Enter>
<S-Left> = :move -1d<Enter>
<S-Right> = :move +1d<Enter>
] = :resize +15m<Enter>
[ = :resize -15m<Enter>
} = :resize +1d<Enter>
{ = :resize -1d<Enter>

# tasks
D = :done<Enter>
y = :accept<Enter>
Y = :maybe<Enter>
N = :decline<Enter>
A = :task<space>
S = :schedule<space>

# undo
u = :undo<Enter>
U = :redo<Enter>
<C-z> = :undo<Enter>
<C-Z> = :redo<Enter>
<C-y> = :redo<Enter>

# calendars
<A-1> = :calendar toggle 1<Enter>
<A-2> = :calendar toggle 2<Enter>
<A-3> = :calendar toggle 3<Enter>
<A-4> = :calendar toggle 4<Enter>
<A-5> = :calendar toggle 5<Enter>
<A-6> = :calendar toggle 6<Enter>
<A-7> = :calendar toggle 7<Enter>
<A-8> = :calendar toggle 8<Enter>
<A-9> = :calendar toggle 9<Enter>

[month]
<Down> = :focus +7<Enter>
<Up> = :focus -7<Enter>
<S-Down> = :move +7d<Enter>
<S-Up> = :move -7d<Enter>

[agenda]
# the list moves with the arrows and opens rows with Enter itself
<Down> =
<Up> =
<Enter> =
<space> =

[tasks]
# Space completes, Enter shows details (e edits)
<Down> =
<Up> =
<space> = :done<Enter>
<Enter> = :open<Enter>
c = :task<space>
C = :subtask<space>
s = :schedule<space>
<Esc> =

[invitations]
<Down> =
<Up> =
<Enter> =
<space> =

[journal]
c = :note<space>
C = :note<Enter>
<Down> =
<Up> =
<space> =

[year]
<Down> = :focus +7<Enter>
<Up> = :focus -7<Enter>
j = :focus +7<Enter>
k = :focus -7<Enter>
