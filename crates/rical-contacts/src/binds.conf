# Contacts' default key bindings, in aerc's binds.conf format, as the
# calendar's. Override or add to these in ~/.config/rical/contacts/binds.conf.
# Sections: [global] applies everywhere; [people] and [duplicates] take
# precedence in their view.

[global]
: = :
? = :help<Enter>
/ = :search<Enter>
<C-f> = :search<Enter>
<C-q> = :quit<Enter>
<C-r> = :reload<Enter>
<F5> = :reload<Enter>
<C-,> = :settings<Enter>

# views
1 = :view people<Enter>
2 = :view duplicates<Enter>
D = :view duplicates<Enter>

# moving
j = :select next<Enter>
k = :select prev<Enter>
<Down> = :select next<Enter>
<Up> = :select prev<Enter>
g = :select first<Enter>
G = :select last<Enter>
<Esc> = :back<Enter>

# people
c = :new<Enter>
<C-n> = :new<Enter>
C = :new<space>
e = :edit<Enter>
<C-e> = :edit<Enter>
x = :delete<Enter>
<Delete> = :delete<Enter>
M = :mail<Enter>
P = :call<Enter>
A = :map<Enter>
O = :open-file<Enter>
y = :copy email<Enter>
Y = :copy phone<Enter>

# undo
u = :undo<Enter>
U = :redo<Enter>
<C-z> = :undo<Enter>
<C-Z> = :redo<Enter>
<C-h> = :history<Enter>

[duplicates]
<Enter> = :merge<Enter>
m = :merge<Enter>
i = :not-duplicates<Enter>
