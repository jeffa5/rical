[package]
name = "rical-contacts"
description = "Contacts (rical): a keyboard-first address book for folders of vCards"
version.workspace = true
edition.workspace = true

[dependencies]
rical-core.workspace = true
rical-cards.workspace = true
rical-ui.workspace = true
anyhow.workspace = true
chrono.workspace = true
log.workspace = true
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_18"] }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_8"] }
