<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f5f4"/>
    </linearGradient>
    <linearGradient id="stamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbe6f"/>
      <stop offset="1" stop-color="#ff7800"/>
    </linearGradient>
    <clipPath id="card"><rect x="12" y="20" width="104" height="92" rx="14"/></clipPath>
  </defs>
  <!-- the envelope, standing on a darker edge, like the calendar's page -->
  <rect x="12" y="24" width="104" height="92" rx="14" fill="#c0bfbc"/>
  <rect x="12" y="20" width="104" height="92" rx="14" fill="url(#page)"/>
  <g clip-path="url(#card)">
    <!-- the flap, in the header band's blue, with rical's ":" -->
    <path d="M12 20H116L64 68Z" fill="url(#head)"/>
    <path d="M12 21L64 68L116 21" fill="none" stroke="#1c71d8" stroke-width="2.5" stroke-opacity="0.5" stroke-linejoin="round"/>
  </g>
  <circle cx="64" cy="29.5" r="3.6" fill="#ffffff"/>
  <circle cx="64" cy="40.5" r="3.6" fill="#ffffff"/>
  <!-- the address -->
  <g fill="#deddda">
    <rect x="24" y="80" width="48" height="8" rx="4"/>
    <rect x="24" y="94" width="36" height="8" rx="4"/>
  </g>
  <rect x="24" y="80" width="30" height="8" rx="4" fill="#9a9996"/>
  <!-- the stamp -->
  <rect x="88" y="76" width="22" height="26" rx="5" fill="url(#stamp)"/>
  <rect x="92" y="80" width="14" height="18" rx="3" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.8" stroke-dasharray="3 2"/>
</svg>
